{{ define "content" }}
<div style="max-width: 360px; margin: 60px auto;">
  <div style="margin-bottom: 20px;">
    <h1 style="font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: #fff;">initial setup</h1>
    <p style="font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); margin-top: 2px;">create root admin to lock registration</p>
  </div>

  <div class="clean-card" style="padding: 24px;">
    {{ if .Error }}
      <div style="background-color: #1a0808; border: 1px solid #441111; color: #ff6666; font-family: var(--font-mono); font-size: 11.5px; padding: 8px; border-radius: var(--radius); margin-bottom: 16px;">
        {{ .Error }}
      </div>
    {{ end }}

    <form action="/register" method="POST">
      <div class="form-group">
        <label class="form-label">admin username</label>
        <input type="text" name="username" class="form-input" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">admin password</label>
        <input type="password" name="password" class="form-input" placeholder="min 6 characters" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 38px; margin-top: 6px;">
        initialize vault
      </button>
    </form>
  </div>
</div>
{{ end }}
