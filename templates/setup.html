{{ define "content" }}
<div style="max-width: 440px; margin: 40px auto;">
  <div style="text-align: center; margin-bottom: 24px;">
    <h1 style="font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.02em;">İlk Kurulum</h1>
    <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 4px;">Süper Yönetici hesabı oluşturulduktan sonra dışarıdan kayıtlar tamamen kilitlenir.</p>
  </div>

  <div class="card" style="padding: 28px;">
    {{ if .Error }}
      <div style="background: var(--accent-danger-bg); border: 1px solid var(--accent-danger); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 18px; font-size: 13px; color: var(--accent-danger);">
        {{ .Error }}
      </div>
    {{ end }}

    <form action="/register" method="POST">
      <div class="form-group">
        <label for="username" class="form-label">Süper Yönetici Kullanıcı Adı</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="Örn: admin" required autofocus style="height: 40px;">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Yönetici Parolası</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="En az 6 karakter" required style="height: 40px;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 42px; font-weight: 600; margin-top: 8px;">
        Yöneticiyi Oluştur ve Sistemi Kilitle
      </button>
    </form>
  </div>
</div>
{{ end }}
