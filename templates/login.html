{{ define "content" }}
<div style="max-width: 380px; margin: 60px auto;">
  <div style="text-align: center; margin-bottom: 24px;">
    <h1 style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-main); margin-bottom: 6px;">Giriş Yap</h1>
    <p style="font-size: 13.5px; color: var(--text-secondary);">Bingo kasanıza erişmek için bilgilerinizi girin</p>
  </div>

  <div class="clean-card">
    {{ if .Error }}
      <div style="background-color: var(--btn-danger-bg); border: 1px solid var(--btn-danger-border); color: var(--btn-danger-text); font-size: 12.5px; padding: 10px 14px; border-radius: var(--radius-md); margin-bottom: 18px;">
        {{ .Error }}
      </div>
    {{ end }}

    <form action="/login" method="POST">
      <div class="field-group" style="margin-bottom: 16px;">
        <label class="field-label">Kullanıcı Adı</label>
        <input type="text" name="username" class="hero-input" style="width: 100%;" placeholder="Kullanıcı adınız" required autofocus>
      </div>

      <div class="field-group" style="margin-bottom: 20px;">
        <label class="field-label">Şifre</label>
        <input type="password" name="password" class="hero-input" style="width: 100%;" placeholder="Şifreniz" required>
      </div>

      <button type="submit" class="btn-hero-submit" style="width: 100%; justify-content: center; height: 42px;">
        Giriş Yap
      </button>
    </form>
  </div>
</div>
{{ end }}
