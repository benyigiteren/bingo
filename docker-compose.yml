services:
  bingo:
    image: ghcr.io/benyigiteren/bingo:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bingo_app
    ports:
      - "${BINGO_HOST_PORT:-8085}:8080"
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/bingo.db
    volumes:
      - bingo_data:/app/data
      - bingo_uploads:/app/uploads
    restart: unless-stopped

volumes:
  bingo_data:
  bingo_uploads:
