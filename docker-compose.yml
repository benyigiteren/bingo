services:
  bingo:
    image: ghcr.io/benyigiteren/bingo:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bingo_app
    ports:
      # Host port conflicts can be overridden via BINGO_HOST_PORT env variable.
      # Default host port changed to 8085 to prevent collisions with 8080.
      - "${BINGO_HOST_PORT:-8085}:8080"
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/bingo.db
    volumes:
      # Persistent storage volumes for database and uploaded shares
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
